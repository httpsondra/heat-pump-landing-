<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MD-Therm">
  <!-- Favicon = výřez značky, ne celá sestava. Důvod je čistě rozměrový:
       plná sestava (vločka + M + D) má poměr 4,5:1, takže ve čtvercové
       ikoně zbyde na kresbu pruh o výšce ~1/5 dlaždice — při 16 px to je
       asi 14,5 × 3,2 px, což je šmouha na jakémkoli podkladu. Vločka proto
       ve faviconě není; M + D-slunce dává „MD" a vyplní čtverec.
       Tvary jsou převzaté 1:1 z /images/logo.svg (pM a pD), nepřekreslené.

       Dlaždice je tmavá (#22282C — grafit značky) záměrně: na světlém
       panelu je to zřetelný tvar, na tmavém panelu ji nese bílé M
       a oranžové slunce. Bílá dlaždice se na světlém panelu ztrácela. -->
  <rect width="64" height="64" rx="14" fill="#22282C"/>
  <g transform="translate(4.37 12.84) scale(0.7368)"
     fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#FFFFFF" d="M4 48 L4 4 L20 26 L36 4 L36 48"/>
    <path stroke="#F4550E" transform="translate(45 0)" d="M4 4 A22 22 0 0 1 4 48"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MD-Therm">
  <!-- Favicon = celá značka (vločka + M + D-slunce), geometrie i barvy
       převzaté 1:1 z /images/logo.svg. Nic se nezjednodušuje.

       Dlaždice je SVĚTLÁ schválně. Na tmavém podkladu má M barvu #22282C,
       tedy skoro splývá s pozadím — v logu je to záměrný „duchový" efekt,
       ale ve 16px ikoně z něj zbyde nečitelná šmouha. Na světlé dlaždici
       drží grafitové M plný kontrast a žádná barva se nemusí měnit;
       navíc je to přesně ta podoba, v jaké logo sedí v hlavičce webu. -->
  <rect width="64" height="64" rx="14" fill="#FFFFFF"/>
  <g transform="translate(1.44 21.19) scale(0.4158)"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vločka — chlazení -->
    <g stroke="#1560E8" stroke-width="6.5" transform="translate(22 26)">
      <line x1="-15" x2="15"/>
      <line x1="-15" x2="15" transform="rotate(60)"/>
      <line x1="-15" x2="15" transform="rotate(120)"/>
    </g>
    <!-- M -->
    <path stroke="#22282C" stroke-width="9" transform="translate(44 0)"
          d="M4 48 L4 4 L20 26 L36 4 L36 48"/>
    <!-- D jako oblouk slunce — topení -->
    <path stroke="#F4550E" stroke-width="9" transform="translate(94 0)"
          d="M4 4 A22 22 0 0 1 4 48"/>
    <!-- Paprsky -->
    <g stroke="#F4550E" stroke-width="6.5" transform="translate(98 26)">
      <line x1="30" x2="42" transform="rotate(-38)"/>
      <line x1="30" x2="42"/>
      <line x1="30" x2="42" transform="rotate(38)"/>
    </g>
  </g>
</svg>
